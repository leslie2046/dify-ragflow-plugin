identity:
  name: search_message
  author: leslie2046
  label:
    en_US: Search messages
    zh_Hans: 搜索消息
description:
  human:
    en_US: Search messages across one or more memories.
    zh_Hans: 在一个或多个记忆中搜索消息。
  llm: Search messages across one or more memories.
parameters:
  - name: query
    form: llm
    human_description:
      en_US: Search query text.
      zh_Hans: 搜索查询文本。
    label:
      en_US: Query
      zh_Hans: 查询
    llm_description: Search query text.
    required: true
    type: string
  - name: memory_id
    form: form
    human_description:
      en_US: Memory IDs, separated by commas.
      zh_Hans: 记忆 ID，多个值用英文逗号分隔。
    label:
      en_US: Memory IDs
      zh_Hans: 记忆 IDs
    llm_description: Memory IDs, separated by commas.
    required: true
    type: string
  - name: agent_id
    form: form
    human_description:
      en_US: Optional agent ID filter.
      zh_Hans: 可选的 Agent ID 过滤条件。
    label:
      en_US: Agent ID
      zh_Hans: Agent ID
    llm_description: Optional agent ID filter.
    required: false
    type: string
  - name: session_id
    form: form
    human_description:
      en_US: Optional session ID filter.
      zh_Hans: 可选的会话 ID 过滤条件。
    label:
      en_US: Session ID
      zh_Hans: 会话 ID
    llm_description: Optional session ID filter.
    required: false
    type: string
  - name: similarity_threshold
    form: form
    human_description:
      en_US: Similarity threshold. Defaults to 0.2.
      zh_Hans: 相似度阈值。默认为 0.2。
    label:
      en_US: Similarity Threshold
      zh_Hans: 相似度阈值
    llm_description: Similarity threshold. Defaults to 0.2.
    required: false
    default: 0.2
    min: 0
    max: 1
    type: number
  - name: keywords_similarity_weight
    form: form
    human_description:
      en_US: Keywords similarity weight. Defaults to 0.7.
      zh_Hans: 关键词相似度权重。默认为 0.7。
    label:
      en_US: Keywords Similarity Weight
      zh_Hans: 关键词相似度权重
    llm_description: Keywords similarity weight. Defaults to 0.7.
    required: false
    default: 0.7
    min: 0
    max: 1
    type: number
  - name: top_n
    form: form
    human_description:
      en_US: Number of matched messages to return. Defaults to 10.
      zh_Hans: 返回的匹配消息数量。默认为 10。
    label:
      en_US: Top N
      zh_Hans: Top N
    llm_description: Number of matched messages to return. Defaults to 10.
    required: false
    default: 10
    min: 1
    max: 1000
    type: number
extra:
  python:
    source: tools/search_message.py
